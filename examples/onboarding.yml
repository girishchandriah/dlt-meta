- data_flow_id: "100"
  data_flow_group: "A1"
  source_system: "MYSQL"
  source_format: "cloudFiles"
  source_details:
    source_database: "APP"
    source_table: "CUSTOMERS"
    source_path_it: "{dbfs_path}/cdc_raw/customers"
    source_metadata:
      include_autoloader_metadata_column: "True"
      autoloader_metadata_col_name: "source_metadata"
      select_metadata_cols:
        input_file_name: "_metadata.file_name"
        input_file_path: "_metadata.file_path"
  landing_catalog_it: "landing_catalog"
  landing_database_it: "landing_it_{run_id}"
  landing_table: "customers_cdc"
  landing_table_comment: "table for customers_cdc"
  landing_reader_options:
    cloudFiles.format: "json"
    cloudFiles.inferColumnTypes: "true"
    cloudFiles.rescuedDataColumn: "_rescued_data"
  landing_table_path_it: "{dbfs_path}/data/landing/customers"
  landing_data_quality_expectations_json_it: "{dbfs_path}/dlt-meta/conf/dqe/customers/landing_data_quality_expectations.json"
  refinery_catalog_it: "refinery_catalog"
  refinery_database_it: "refinery"
  refinery_table: "customers"
  refinery_table_comment: "refinery table for customers"
  refinery_cdc_apply_changes:
    keys:
      - "id"
    sequence_by: "operation_date"
    scd_type: "1"
    apply_as_deletes: "operation = 'DELETE'"
    except_column_list:
      - "operation"
      - "operation_date"
      - "_rescued_data"
  refinery_table_path_it: "{dbfs_path}/data/refinery/customers"
  refinery_transformation_json_it: "{dbfs_path}/dlt-meta/conf/refinery_transformations.json"

- data_flow_id: "101"
  data_flow_group: "A1"
  source_system: "MYSQL"
  source_format: "cloudFiles"
  source_details:
    source_database: "APP"
    source_table: "TRANSACTIONS"
    source_path_it: "{dbfs_path}/cdc_raw/transactions"
  landing_database_it: "landing_it_{run_id}"
  landing_table: "transactions_cdc"
  landing_table_comment: "landing table for transactions_cdc"
  landing_reader_options:
    cloudFiles.format: "json"
    cloudFiles.inferColumnTypes: "true"
    cloudFiles.rescuedDataColumn: "_rescued_data"
  landing_partition_columns: ""
  landing_table_path_it: "{dbfs_path}/data/landing/transactions"
  landing_data_quality_expectations_json_it: "{dbfs_path}/dlt-meta/conf/dqe/transactions/landing_data_quality_expectations.json"
  landing_catalog_quarantine_it: "landing_catalog"
  landing_database_quarantine_it: "landing_it_{run_id}"
  landing_quarantine_table: "transactions_cdc_quarantine"
  landing_quarantine_table_comment: "quarantine table for transactions_cdc_quarantine"
  landing_quarantine_table_path_it: "{dbfs_path}/data/landing/transactions_quarantine"
  landing_quarantine_table_partitions: ""
  refinery_database_it: "refinery_it_{run_id}"
  refinery_table: "transactions"
  refinery_table_comment: "refinery table for transactions"
  refinery_cdc_apply_changes:
    keys:
      - "id"
    sequence_by: "operation_date"
    scd_type: "1"
    apply_as_deletes: "operation = 'DELETE'"
    except_column_list:
      - "operation"
      - "operation_date"
      - "_rescued_data"
  refinery_partition_columns: ""
  refinery_table_path_it: "{dbfs_path}/data/refinery/transactions"
  refinery_transformation_json_it: "{dbfs_path}/dlt-meta/conf/refinery_transformations.json"

- data_flow_id: "103"
  data_flow_group: "A2"
  source_system: "Sensor Device"
  source_format: "eventhub"
  source_details:
    source_schema_path: "{dbfs_path}/resources/eventhub_iot_schema.ddl"
    eventhub.accessKeyName: "{eventhub_accesskey_name}"
    eventhub.name: "{eventhub_name}"
    eventhub.accessKeySecretName: "{eventhub_accesskey_secret_name}"
    eventhub.secretsScopeName: "{eventhub_secrets_scope_name}"
    kafka.sasl.mechanism: "PLAIN"
    kafka.security.protocol: "SASL_SSL"
    eventhub.namespace: "{eventhub_nmspace}"
    eventhub.port: "{eventhub_port}"
  landing_reader_options:
    maxOffsetsPerTrigger: "50000"
    startingOffsets: "latest"
    failOnDataLoss: "false"
    kafka.request.timeout.ms: "60000"
    kafka.session.timeout.ms: "60000"
  landing_catalog_it: "landing_catalog"
  landing_database_it: "landing_it_{run_id}"
  landing_table: "landing_{run_id}_iot"
  landing_table_comment: "landing table for iot"
  landing_partition_columns: "date"
  landing_table_path_it: "{dbfs_path}/data/landing/iot"
  landing_data_quality_expectations_json_it: "{dbfs_path}/dlt-meta/conf/dlt-meta/dqe/iot/landing_data_quality_expectations.json"
  landing_catalog_quarantine_it: "landing_catalog"
  landing_database_quarantine_it: "landing_it_{run_id}"
  landing_quarantine_table: "landing_{run_id}_iot_quarantine"
  landing_quarantine_table_path_it: "{dbfs_path}/data/landing/iot_quarantine"
  refinery_catalog_it: ""
  refinery_database_it: ""
  refinery_database_staging: ""
  refinery_database_prd: ""
  refinery_table: ""
  refinery_table_comment: ""
  refinery_cdc_apply_changes: ""
  refinery_partition_columns: ""
  refinery_table_path_it: ""
  refinery_table_path_staging: ""
  refinery_table_path_prd: ""
  refinery_transformation_json_it: ""