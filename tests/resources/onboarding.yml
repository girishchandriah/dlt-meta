- data_flow_id: "103"
  data_flow_group: "A2"
  source_system: "MYSQL"
  source_format: "eventhub"
  source_details:
    source_schema_path: "tests/resources/schema/eventhub_iot_schema.ddl"
    eventhub.accessKeyName: "iotIngestionAccessKey"
    eventhub.name: "iot"
    eventhub.accessKeySecretName: "iotIngestionAccessKey"
    eventhub.secretsScopeName: "eventhubs_creds"
    kafka.sasl.mechanism: "PLAIN"
    kafka.security.protocol: "SASL_SSL"
    kafka.bootstrap.servers: "standard.servicebus.windows.net:9093"
  landing_catalog_staging: "landing_cl"
  landing_catalog_prd: "landing_cl"
  landing_database_dev: "landing"
  landing_database_staging: "landing"
  landing_database_prd: "landing"
  landing_table: "iot_cdc"
  landing_table_comment: "landing table for IoT data"
  landing_reader_options:
    maxOffsetsPerTrigger: "50000"
    startingOffsets: "latest"
    failOnDataLoss: "false"
    kafka.request.timeout.ms: "60000"
    kafka.session.timeout.ms: "60000"
  landing_table_path_dev: "tests/resources/delta/iot_cdc"
  landing_table_path_staging: "s3://db-dlt-meta-staging/demo/data/landing/iot_cdc"
  landing_table_path_prd: "s3://db-dlt-meta-prod/demo/data/landing/iot_cdc"
  landing_data_quality_expectations_json_dev: "tests/resources/dqe/iot_cdc/landing_data_quality_expectations.json"
  refinery_catalog_dev: "refinery_cl"
  refinery_catalog_staging: "refinery_cl"
  refinery_catalog_prd: "refinery_cl"
  refinery_database_dev: "refinery"
  refinery_table: "iot_cdc"
  refinery_table_comment: "refinery table for IoT data"
  refinery_cdc_apply_changes:
    keys:
      - "device_id"
    sequence_by: "timestamp"
    scd_type: "1"
    apply_as_deletes: "operation = 'DELETE'"
    except_column_list: []
  refinery_table_path_dev: "tests/resources/data/refinery/iot_cdc"
  refinery_transformation_json_dev: "tests/resources/refinery_transformations.json"
  refinery_data_quality_expectations_json_dev: "tests/resources/dqe/iot_cdc/refinery_data_quality_expectations.json" 