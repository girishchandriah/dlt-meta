target_table: pfocusdb_sales_ord_tran_dlt_v2
transformation_name: Sales Order Transaction Combined Treasury Transformation (Landing → Treasury)
description: "Combined transformation: Reads directly from landing, applies all refinery transformations, handles void logic, and writes to treasury. No refinery table needed."
sql_query: |
  -- Step 1: Apply all refinery transformations (from step 2)
  with q_extract as (
    select
      case
        when f.system = 'AU1' then 'AUS'
        when f.system = 'LON' then 'UK1'
        when f.system = 'INT' then 'UK2'
        else upper(f.system)
      end as system,
      case
        when trim(upper(f.voidflag)) = 'T' then 0.0000
        else f.facilityfee
      end as facility_fee,
      if(
        substring(f.accountdate FROM -2) >
        (select int(value) from dataservices_nonprod.refinery_nonprod.jobs_configurations where key='century_year'),
        add_months(to_date(f.accountdate,'M/d/yy'), -1200),
        to_date(f.accountdate, 'M/d/yy')
      ) as acctdate,
      f.mimic_flag as mimic_flg,
      if(f.tkt_transfer_rcvd_flg=1, 'Y', if(f.tkt_transfer_rcvd_flg=0, 'N', null)) as tkt_transfer_rcvd_flg,
      if(f.tkt_transfer_surrender_flg=1, 'Y', if(f.tkt_transfer_surrender_flg=0, 'N', null)) as tkt_transfer_surrender_flg,
      f.firstqualifier as firstqual,
      case
        when trim(upper(f.voidflag)) = 'T' then 0.0000
        else f.zonecharge
      end as distance_charge,
      if(f.tkt_transfer_sent_flg=1, 'Y', if(f.tkt_transfer_sent_flg=0, 'N', null)) as tkt_transfer_sent_flg,
      if(f.resale_status_nm=1, 'Available',
        if(f.resale_status_nm=2, 'Purchased',
          if(f.resale_status_nm=3, 'Sold', null))) as resale_status_nm,
      case
        when trim(upper(f.voidflag)) = 'T' then 0.0000
        else f.servicedollars
      end as serchg,
      f.exmopname as expmopname,
      case
        when (trim(upper(f.voidflag)) = 'F' and (f.voidopcode IS null or f.voidopcode = '')) then 'NOT APPLICABLE'
        when (f.voidopcode IS null or f.voidopcode = '') then 'UNKNOWN'
        else f.voidopcode
      end as vcode,
      case
        when trim(upper(f.voidflag)) = 'T' then 0.0000
        else f.exchangefee
      end as exchangee_fee,
      case
        when trim(upper(f.voidflag)) = 'T' then 0.0000
        else f.servicetax
      end as ser_chrg_tax,
      case
        when trim(upper(f.voidflag)) = 'T' then 0.0000
        else f.totaldollars
      end as tsale,
      trim(upper(f.voidflag)) as vflag,
      f.voiddate as vdate,
      f.vaxacct as _account,
      case
        when trim(upper(f.voidflag)) = 'T' then 0.0000
        else f.tax
      end as set_tax,
      f.vaxevid as vaxevid,
      f.pricelevelid as price_level,
      case
        when trim(upper(f.voidflag)) = 'T' then 0
        else f.tickets
      end as tqty,
      f.firstqualifier as seatloc,
      case
        when trim(upper(f.voidflag)) = 'T' then 0.0000
        else f.ticketvalue
      end as ticket_value,
      case
        when trim(upper(f.voidflag)) = 'T' then 0.0000
        else f.servicetax2
      end as ser_chrg_tax2,
      f.exmopid as expmop,
      f.transnum as trnum,
      f.seattypes as num_stypes,
      f.vcode_used as void_used_opr_cd,
      f.printflag as pflag,
      f.pricelevelname as price_level_name,
      f.printdate as pdate,
      case
        when (upper(trim(f.printflag)) = 'F' and (f.printopcode IS null or f.printopcode = '')) then 'NOT APPLICABLE'
        when (f.printopcode IS null or f.printopcode = '') then 'UNKNOWN'
        else f.printopcode
      end as pcode,
      f.transdate as tdate,
      case
        when f.transopcode IS null or f.transopcode = '' then 'UNKNOWN'
        else f.transopcode
      end as tcode,
      f.acmode as acmode
    from LIVE.pfocusst_ff_src_hst_dsn_trans_dlt_v2 f
  ),

  -- Step 2: Apply date conversions and get operator types
  query as (
    select
      q_extract.system,
      q_extract._account,
      q_extract.acctdate,
      q_extract.vaxevid,
      q_extract.trnum,
      if(
        substring(q_extract.tdate FROM -2) >
        (select int(value) from dataservices_nonprod.refinery_nonprod.jobs_configurations where key='century_year'),
        add_months(to_date(q_extract.tdate,'M/d/yy'), -1200),
        to_date(q_extract.tdate, 'M/d/yy')
      ) as tdate,
      q_extract.tcode,
      if(
        substring(q_extract.pdate FROM -2) >
        (select int(value) from dataservices_nonprod.refinery_nonprod.jobs_configurations where key='century_year'),
        add_months(to_date(q_extract.pdate,'M/d/yy'), -1200),
        to_date(q_extract.pdate, 'M/d/yy')
      ) as pdate,
      q_extract.pcode,
      if(
        substring(q_extract.vdate FROM -2) >
        (select int(value) from dataservices_nonprod.refinery_nonprod.jobs_configurations where key='century_year'),
        add_months(to_date(q_extract.vdate,'M/d/yy'), -1200),
        to_date(q_extract.vdate, 'M/d/yy')
      ) as vdate,
      q_extract.vcode,
      q_extract.pflag,
      q_extract.vflag,
      q_extract.tqty,
      q_extract.num_stypes,
      q_extract.tsale,
      q_extract.ticket_value,
      q_extract.serchg,
      q_extract.facility_fee,
      q_extract.exchangee_fee,
      q_extract.expmop,
      q_extract.expmopname,
      q_extract.firstqual,
      q_extract.seatloc,
      q_extract.acmode,
      q_extract.price_level,
      q_extract.price_level_name,
      q_extract.set_tax,
      q_extract.distance_charge,
      q_extract.ser_chrg_tax,
      q_extract.ser_chrg_tax2,
      q_extract.mimic_flg,
      q_extract.tkt_transfer_rcvd_flg,
      q_extract.tkt_transfer_surrender_flg,
      q_extract.tkt_transfer_sent_flg,
      q_extract.resale_status_nm,
      q_extract.void_used_opr_cd,
      dataservices_nonprod.refinery_nonprod.cdsudf_getoptype(q_extract.vcode, q_extract.system, q_extract.acctdate) as void_optype,
      dataservices_nonprod.refinery_nonprod.cdsudf_getoptype(q_extract.tcode, q_extract.system, q_extract.acctdate) as tran_optype,
      dataservices_nonprod.refinery_nonprod.cdsudf_getoptype(q_extract.pcode, q_extract.system, q_extract.acctdate) as print_optype
    from q_extract
  ),

  -- Step 3: Get sales_ord_id lookup
  enriched_data as (
    select
      q.*,
      o.sales_ord_id
    from query q
    left join dataservices_nonprod.treasury_teradata_base_nonprod.pfocusdb_sales_ord o
      on trim(upper(q.system)) = trim(upper(o.host_sys_cd))
      and q.acctdate = o.host_acct_create_dt
      and q._account = o.host_vax_acct_num
    where o.sales_ord_id is not null  -- Only process records with sales_ord_id
  ),

  -- Step 4: Filter out already-processed records (exist in treasury)
  existing_treasury as (
    select
      host_sys_cd,
      host_vax_acct_num,
      host_acct_create_dt,
      event_id,
      sales_ord_tran_id,
      sales_ord_tran_dt
    from LIVE.pfocusdb_sales_ord_tran_dlt_v2
  ),

  new_records as (
    select e.*
    from enriched_data e
    left join existing_treasury t
      on trim(upper(e.system)) = trim(upper(t.host_sys_cd))
      and e._account = t.host_vax_acct_num
      and e.acctdate = t.host_acct_create_dt
      and e.vaxevid = t.event_id
      and e.trnum = t.sales_ord_tran_id
      and e.tdate = t.sales_ord_tran_dt
    where t.host_sys_cd is null  -- Not in treasury yet
  ),

  -- Step 5: UNION - Part 1: Regular transactions (non-void)
  regular_transactions as (
    select
      st.sales_ord_id,
      st.system as host_sys_cd,
      st._account as host_vax_acct_num,
      st.acctdate as host_acct_create_dt,
      st.vaxevid as event_id,
      cast(null as string) as event_id_src_sys_cd,
      cast(null as string) as src_event_id,
      st.trnum as sales_ord_tran_id,
      st.tdate as sales_ord_tran_dt,
      cast(null as string) as sales_ord_trans_lcl_dttm,
      coalesce(st.tsale, 0) as tran_amt,
      st.acmode as acct_mode_cd,
      coalesce(st.tqty, 0) as tickets_purchased_qty,
      st.pflag as print_flg,
      st.pdate as print_dt,
      st.vflag as tran_void_flg,
      st.vdate as tran_void_dt,
      cast(null as string) as print_opr_id,
      st.pcode as print_opr_cd,
      st.print_optype as ovrrd_print_opr_type_cd,
      cast(null as string) as tran_opr_id,
      st.tcode as tran_opr_cd,
      st.tran_optype as ovrrd_tran_opr_type_cd,
      cast(null as string) as void_opr_id,
      st.vcode as void_opr_cd,
      st.void_optype as ovrrd_void_opr_type_cd,
      coalesce(st.ticket_value, 0) as trans_face_val_amt,
      coalesce(st.serchg, 0) as trans_service_charge_amt,
      coalesce(st.ser_chrg_tax, 0) as trans_service_tax_amt,
      coalesce(st.ser_chrg_tax2, 0) as trans_service_tax_2_amt,
      coalesce(st.set_tax, 0) as trans_set_tax_amt,
      coalesce(st.distance_charge, 0) as trans_zone_charge_amt,
      coalesce(st.facility_fee, 0) as trans_fac_fee_amt,
      coalesce(st.exchangee_fee, 0) as trans_exch_fee_amt,
      cast(null as string) as last_batch_id,
      cast(null as string) as init_run_id,
      cast(null as string) as last_run_id,
      current_timestamp() as insert_ts,
      current_timestamp() as update_ts,
      st.tkt_transfer_sent_flg,
      st.tkt_transfer_rcvd_flg,
      st.tkt_transfer_surrender_flg,
      initcap(lower(st.resale_status_nm)) as resale_status_nm,
      cast(null as string) as upsell_flg,
      cast(null as string) as dlvry_flg,
      st.void_used_opr_cd,
      st.mimic_flg,
      st.price_level as price_level_id,
      st.price_level_name as price_level_nm,
      cast(null as string) as expected_pmt_method_type_id,
      cast(null as string) as expected_pmt_method_type_cd,
      st.num_stypes as tkt_type_cnt
    from new_records st
    where coalesce(upper(trim(st.vflag)), '') <> 'T'  -- Non-void transactions
  ),

  -- Step 6: UNION - Part 2: Void transactions (update existing treasury records)
  void_transactions as (
    select
      d.sales_ord_id,
      d.system as host_sys_cd,
      d._account as host_vax_acct_num,
      d.acctdate as host_acct_create_dt,
      d.vaxevid as event_id,
      t.event_id_src_sys_cd,
      t.src_event_id,
      d.trnum as sales_ord_tran_id,
      d.tdate as sales_ord_tran_dt,
      t.sales_ord_trans_lcl_dttm,
      -- Zero out amounts if void date = transaction date
      case when d.vdate = t.sales_ord_tran_dt then 0 else t.tran_amt end as tran_amt,
      t.acct_mode_cd,
      case when d.vdate = t.sales_ord_tran_dt then 0 else t.tickets_purchased_qty end as tickets_purchased_qty,
      t.print_flg,
      t.print_dt,
      d.vflag as tran_void_flg,  -- Update void flag
      d.vdate as tran_void_dt,   -- Update void date
      t.print_opr_id,
      t.print_opr_cd,
      t.ovrrd_print_opr_type_cd,
      t.tran_opr_id,
      t.tran_opr_cd,
      t.ovrrd_tran_opr_type_cd,
      t.void_opr_id,
      d.vcode as void_opr_cd,    -- Update void operator code
      d.void_optype as ovrrd_void_opr_type_cd,  -- Update void operator type
      case when d.vdate = t.sales_ord_tran_dt then 0 else t.trans_face_val_amt end as trans_face_val_amt,
      case when d.vdate = t.sales_ord_tran_dt then 0 else t.trans_service_charge_amt end as trans_service_charge_amt,
      case when d.vdate = t.sales_ord_tran_dt then 0 else t.trans_service_tax_amt end as trans_service_tax_amt,
      case when d.vdate = t.sales_ord_tran_dt then 0 else t.trans_service_tax_2_amt end as trans_service_tax_2_amt,
      case when d.vdate = t.sales_ord_tran_dt then 0 else t.trans_set_tax_amt end as trans_set_tax_amt,
      case when d.vdate = t.sales_ord_tran_dt then 0 else t.trans_zone_charge_amt end as trans_zone_charge_amt,
      case when d.vdate = t.sales_ord_tran_dt then 0 else t.trans_fac_fee_amt end as trans_fac_fee_amt,
      case when d.vdate = t.sales_ord_tran_dt then 0 else t.trans_exch_fee_amt end as trans_exch_fee_amt,
      cast(null as string) as last_batch_id,
      t.init_run_id,
      cast(null as string) as last_run_id,
      t.insert_ts,
      current_timestamp() as update_ts,
      d.tkt_transfer_sent_flg,
      d.tkt_transfer_rcvd_flg,
      d.tkt_transfer_surrender_flg,
      initcap(lower(d.resale_status_nm)) as resale_status_nm,
      t.upsell_flg,
      t.dlvry_flg,
      d.void_used_opr_cd,
      d.mimic_flg,
      t.price_level_id,
      t.price_level_nm,
      t.expected_pmt_method_type_id,
      t.expected_pmt_method_type_cd,
      t.tkt_type_cnt
    from enriched_data d  -- All data including voids
    join LIVE.pfocusdb_sales_ord_tran_dlt_v2 t
      on trim(upper(t.host_sys_cd)) = trim(upper(d.system))
      and t.host_vax_acct_num = d._account
      and t.host_acct_create_dt = d.acctdate
      and t.event_id = d.vaxevid
      and t.sales_ord_tran_id = d.trnum
      and t.sales_ord_tran_dt = d.tdate
      and trim(upper(t.tran_void_flg)) = 'F'  -- Find existing non-void records
    where trim(upper(d.vflag)) = 'T'  -- Match with incoming void transactions
  )

  -- Step 7: UNION all results
  select * from regular_transactions
  union all
  select * from void_transactions
