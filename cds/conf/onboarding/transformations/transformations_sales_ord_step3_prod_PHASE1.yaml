target_table: pfocusdb_sales_ord_tran_dlt
transformation_name: Sales Order Transaction Treasury Transformation - Phase 1 (Initial Run)
description: "Step 3 Phase 1: Initial run without self-referential checks. Inserts non-void transactions from refinery to treasury. Run this for the first pipeline execution, then switch to PHASE2."
sql_query: |
  select
    st.sales_ord_id,
    st.system as host_sys_cd,
    st._account as host_vax_acct_num,
    st.acctdate as host_acct_create_dt,
    st.vaxevid as event_id,
    cast(null as string) as event_id_src_sys_cd,
    cast(null as string) as src_event_id,
    st.trnum as sales_ord_tran_id,
    st.tdate as sales_ord_tran_dt,
    cast(null as string) as sales_ord_trans_lcl_dttm,
    coalesce(st.tsale, 0) as tran_amt,
    st.acmode as acct_mode_cd,
    coalesce(st.tqty, 0) as tickets_purchased_qty,
    st.pflag as print_flg,
    st.pdate as print_dt,
    st.vflag as tran_void_flg,
    st.vdate as tran_void_dt,
    cast(null as string) as print_opr_id,
    st.pcode as print_opr_cd,
    st.print_optype as ovrrd_print_opr_type_cd,
    cast(null as string) as tran_opr_id,
    st.tcode as tran_opr_cd,
    st.tran_optype as ovrrd_tran_opr_type_cd,
    cast(null as string) as void_opr_id,
    st.vcode as void_opr_cd,
    st.void_optype as ovrrd_void_opr_type_cd,
    coalesce(st.ticket_value, 0) as trans_face_val_amt,
    coalesce(st.serchg, 0) as trans_service_charge_amt,
    coalesce(st.ser_chrg_tax, 0) as trans_service_tax_amt,
    coalesce(st.ser_chrg_tax2, 0) as trans_service_tax_2_amt,
    coalesce(st.set_tax, 0) as trans_set_tax_amt,
    coalesce(st.distance_charge, 0) as trans_zone_charge_amt,
    coalesce(st.facility_fee, 0) as trans_fac_fee_amt,
    coalesce(st.exchangee_fee, 0) as trans_exch_fee_amt,
    st.last_batch_id,
    st.init_run_id,
    st.last_run_id,
    st.insert_ts,
    st.update_ts,
    st.tkt_transfer_sent_flg,
    st.tkt_transfer_rcvd_flg,
    st.tkt_transfer_surrender_flg,
    initcap(lower(st.resale_status_nm)) as resale_status_nm,
    cast(null as string) as upsell_flg,
    cast(null as string) as dlvry_flg,
    st.void_used_opr_cd,
    st.mimic_flg,
    st.price_level as price_level_id,
    st.price_level_name as price_level_nm,
    cast(null as string) as expected_pmt_method_type_id,
    cast(null as string) as expected_pmt_method_type_cd,
    st.num_stypes as tkt_type_cnt
  from LIVE.pfocusst_dsn_st_trans_dl_dlt st
  where st.sales_ord_id is not null
    and coalesce(upper(trim(st.vflag)), '') <> 'T'
