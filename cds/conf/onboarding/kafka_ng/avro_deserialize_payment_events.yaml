target_table: payment_events
transformation_name: Avro Deserialization for Payment Events
description: "Deserializes Avro-encoded payment events from Kafka using Schema Registry with SSL certificate authentication (JKS keystores)"
sql_query: |
  SELECT
    payment.payment_id,
    payment.customer_id,
    payment.amount,
    payment.currency,
    payment.payment_method,
    CAST(payment.transaction_timestamp AS TIMESTAMP) as transaction_timestamp,
    payment.status,
    payment.metadata,
    DATE(CAST(payment.transaction_timestamp AS TIMESTAMP)) as payment_date,
    topic,
    partition,
    offset,
    kafka_timestamp
  FROM (
    SELECT
      topic,
      partition,
      offset,
      timestamp as kafka_timestamp,
      from_avro(
        value,
        'payment-events-value',
        map(
          'url', 'https://schema-registry.company.com:8081',
          'ssl.truststore.location', '/Volumes/dataservices_nonprod/landing_nonprod/shared_resources/kafka_ssl/schema-registry.truststore.jks',
          'ssl.truststore.password', '{{secrets/schema_registry/truststore_password}}',
          'ssl.keystore.location', '/Volumes/dataservices_nonprod/landing_nonprod/shared_resources/kafka_ssl/schema-registry.keystore.jks',
          'ssl.keystore.password', '{{secrets/schema_registry/keystore_password}}',
          'ssl.key.password', '{{secrets/schema_registry/key_password}}',
          'mode', 'PERMISSIVE'
        )
      ) as payment
    FROM LIVE.kafka_payment_events_raw
  )
