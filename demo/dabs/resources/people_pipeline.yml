# landing and refinery DLT Meta Pipelines for People Data
resources:
  pipelines:
    pipeline_landing_people:
      name: People - R2B Pipeline1
      catalog: ${var.${bundle.target}_catalog_name}
      schema: ${var.landing_schema}
      development: ${var.${bundle.target}_development_enabled}
      photon: ${var.photon_enabled}
      serverless: ${var.serverless_enabled}
      libraries:
        - notebook:
            path: ${workspace.file_path}/notebooks/init_dlt_meta_pipeline

      configuration:
        layer: landing
        dummy_param: ${var.dummy_param}       
        landing.dataflowspecTable: ${var.${bundle.target}_catalog_name}.${var.dlt_meta_schema}.${var.landing_dataflowspecTable}
        landing.group: my_people
        bundle.sourcePath: ${workspace.file_path}/notebooks

    pipeline_refinery_people:
      name: People - B2S Pipeline1
      catalog: ${var.${bundle.target}_catalog_name}
      schema: ${var.refinery_schema}
      development: ${var.${bundle.target}_development_enabled}
      photon: ${var.photon_enabled}
      serverless: ${var.serverless_enabled}
      libraries:
        - notebook:
            path: ${workspace.file_path}/notebooks/init_dlt_meta_pipeline

      configuration:
        layer: refinery
        dummy_param: ""
        refinery.dataflowspecTable: ${var.${bundle.target}_catalog_name}.${var.dlt_meta_schema}.${var.refinery_dataflowspecTable}
        refinery.group: my_people
        bundle.sourcePath: ${workspace.file_path}/notebooks
        
