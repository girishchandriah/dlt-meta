# landing and refinery DLT Meta Onboarding for People Data
# yaml-language-server: $schema=../bundle_config_schema.json

resources:
  jobs:
    onboard_people:
      name: People - Onboard Job
      description: "Job to onboard DLT META data"

      job_clusters:
        - job_cluster_key: onboard_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 1
            spark_conf:
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode

      tasks:
        - task_key: onboard_landing_refinery_tables
          python_wheel_task:
            package_name: dlt_meta_cds
            entry_point: run
            named_parameters:
              database: ${var.${bundle.target}_catalog_name}.${var.dlt_meta_schema}
              onboarding_file_path: ${var.people_onboarding_file_path}
              landing_dataflowspec_table: ${var.landing_dataflowspecTable}
              refinery_dataflowspec_table: ${var.refinery_dataflowspecTable}
              uc_enabled: ${var.uc_enabled}
              import_author: ${var.author}
              version: ${var.version}
              onboard_layer: landing_refinery
              overwrite: "True"
              env: ${bundle.target}

          libraries:
            - whl: ${workspace.artifact_path}/artifacts/dlt_meta_wheel/*.whl

          job_cluster_key: onboard_cluster

        - task_key: onboard_refinery_fanout_tables
          python_wheel_task:
            package_name: dlt_meta_cds
            entry_point: run
            named_parameters:
              database: ${var.${bundle.target}_catalog_name}.${var.dlt_meta_schema}
              onboarding_file_path: ${var.people_fanout_onboarding_file_path}
              refinery_dataflowspec_table: ${var.refinery_dataflowspecTable}
              uc_enabled: ${var.uc_enabled}
              import_author: ${var.author}
              version: ${var.version}
              onboard_layer: refinery
              overwrite: "False"
              env: ${bundle.target}

          libraries:
            - whl: ${workspace.artifact_path}/artifacts/dlt_meta_wheel/*.whl

          job_cluster_key: onboard_cluster

          depends_on:
            - task_key: onboard_landing_refinery_tables


      # Removed PyPI dependencies - using local wheel artifact instead
      # environments:
      #   - environment_key: default
      #     spec:
      #       client: "1"
      #       dependencies:
      #         - dlt-meta

    execute_pipelines_people:
      name: People - Raw_Br_Si Job
      description: "Job to execute the landing and refinery DLT-META pipelines"

      tasks:
        - task_key: landing_people_pipeline
          description: "Run DLT pipeline for landing People"
          pipeline_task:
            pipeline_id: ${resources.pipelines.pipeline_landing_people.id}
            full_refresh: true

        - task_key: refinery_people_pipeline
          description: "Run DLT pipeline for refinery People"
          pipeline_task:
            pipeline_id: ${resources.pipelines.pipeline_refinery_people.id}
            full_refresh: true
          depends_on:
            - task_key: landing_people_pipeline